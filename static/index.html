<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ניהול תפריט | מערכת הזמנת ארוחות</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">מערכת הזמנת ארוחות • UC024–UC026</span>
      <h1>ניהול תפריט מסעדה</h1>
      <p>הוספת מנות, עדכון מחירים וסימון מנות כחסרות במלאי מול SQL Server</p>
    </div>
    <div id="serverStatus" class="server"><span class="server-dot"></span><span id="serverText">בודק חיבור...</span></div>
  </header>

  <main>
    <section class="controls card">
      <label>מסעדה
        <select id="restaurant"></select>
      </label>
      <label>חיפוש
        <input id="search" type="search" placeholder="שם או תיאור מנה">
      </label>
      <button id="addButton" class="primary" type="button">＋ הוספת מנה</button>
    </section>

    <section class="metrics" aria-label="סיכום">
      <article><strong id="totalCount">0</strong><span>סך הכול מנות</span></article>
      <article><strong id="availableCount">0</strong><span>מנות זמינות</span></article>
      <article><strong id="missingCount">0</strong><span>מנות חסרות</span></article>
    </section>

    <section class="menu-section">
      <div class="section-heading">
        <h2>מנות בתפריט</h2>
        <button id="refreshButton" class="ghost" type="button">רענון</button>
      </div>
      <div id="menuGrid" class="menu-grid"></div>
      <div id="emptyState" class="empty" hidden>לא נמצאו מנות להצגה.</div>
    </section>
  </main>

  <div id="dialogLayer" class="dialog-layer" hidden>
    <button id="backdrop" class="backdrop" aria-label="סגירת החלון"></button>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-title">
        <div><span id="useCase" class="eyebrow">UC024</span><h2 id="dialogTitle">הוספת מנה חדשה</h2></div>
        <button id="closeButton" class="icon" aria-label="סגירה">×</button>
      </div>
      <form id="itemForm" novalidate>
        <input id="itemId" type="hidden">
        <label id="nameField">שם המנה *
          <input id="itemName" maxlength="100" required>
          <small id="nameError" class="error"></small>
        </label>
        <div class="form-row">
          <label>מחיר *
            <input id="price" type="number" min="0.01" max="9999.99" step="0.01" required>
            <small id="priceError" class="error"></small>
          </label>
          <label id="stockField" class="check"><input id="inStock" type="checkbox" checked> זמינה להזמנה</label>
        </div>
        <label>תיאור
          <textarea id="description" maxlength="500" rows="5"></textarea>
        </label>
        <div class="actions">
          <button class="primary" type="submit">שמירת המנה</button>
          <button id="cancelButton" class="secondary" type="button">ביטול</button>
        </div>
      </form>
    </section>
  </div>
  <div id="status" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
